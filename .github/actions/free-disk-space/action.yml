name: Free disk space
description: >-
  Free disk space on the runner and switch Docker to the containerd image store
  (overlay2's docker load does not take an OCI layout).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift \
          /usr/lib/jvm /usr/share/miniconda /usr/lib/google-cloud-sdk /opt/microsoft /opt/az \
          /usr/local/julia* /usr/local/share/powershell /usr/local/share/boost /usr/local/share/chromium \
          /home/linuxbrew /usr/local/aws-cli /usr/local/aws-sam-cli
        docker system prune -af
        echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
        # Some x86_64 runners have a 72 GB root disk (/dev/mapper/cow-root,
        # 45 GB free after the old cleanup) instead of the usual 145 GB. The
        # rechunk stage of the larger variants runs out of it (rpm-ostree:
        # "No space left on device", "min-free-space-percent '3%' would be
        # exceeded"; centos-base, centos-kde and gnome in the runs of 1 and
        # 3 November). The cleanup above frees more, and where /mnt is a
        # bigger, separate disk than the root, Docker's and containerd's
        # stores go there.
        root_free=$(df --output=avail -B1 / | tail -n1)
        mnt_free=$(df --output=avail -B1 /mnt | tail -n1)
        if [ "$(df --output=source / | tail -n1)" != "$(df --output=source /mnt | tail -n1)" ] &&
           [ "$mnt_free" -gt "$root_free" ]; then
          sudo systemctl stop docker.socket docker containerd
          for d in docker containerd; do
            sudo rm -rf "/var/lib/$d"/*
            sudo mkdir -p "/mnt/$d" "/var/lib/$d"
            sudo mount --bind "/mnt/$d" "/var/lib/$d"
          done
          sudo systemctl start containerd
        fi
        sudo systemctl restart docker
        df -h / /mnt /var/lib/docker
