# The driver is in every image, so the unit's own check (the module is
# installed) passes on a machine with no NVIDIA GPU and the unit fails at each
# boot, leaving the system degraded. Skip it unless there is an NVIDIA PCI
# device (or WSL, which has /dev/dxg).
[Service]
ExecCondition=/bin/sh -c 'grep -qs ^0x10de /sys/bus/pci/devices/*/vendor || [ -e /dev/dxg ]'
