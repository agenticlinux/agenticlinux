# The docker group. docker-ce creates it with groupadd when it is installed,
# which puts it in the image's /etc/group and nowhere else; a machine whose
# /etc/group has been edited keeps its own copy of that file when it is switched
# to a new image, and without the group docker.socket fails ("Failed to resolve
# group 'docker'"). systemd-sysusers adds it back at boot when it is missing, and
# leaves it alone when it is there.
g docker -
